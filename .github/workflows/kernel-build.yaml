# =====================================================================
# Android Kernel Build - Sony Xperia XZ Premium (maple / G8141)
# Platform: Qualcomm MSM8998 | Kernel: Linux 4.4.302
# Compiler: AOSP clang 14.0.6 (r450784d) + GNU binutils aarch64
#
# Multi-branch / multi-tag build:
#   - pick 'branch' or 'tag' via a dropdown
#   - enter one or more refs (comma separated) to build, each gets its own
#     matrix job; all artifacts are merged into a single release.
#
# Outputs per ref:
#   - kernel-<ref>-<sha>.zip : AnyKernel3 (flash from TWRP)
#   - Image.gz-dtb           : raw kernel+dtb image (for dd)
# =====================================================================
name: Android Kernel Build (MSM8998 maple)

"on":
  workflow_dispatch:
    inputs:
      ref_type:
        description: 'Type of ref to build'
        required: true
        default: 'branch'
        type: choice
        options:
          - branch
          - tag
      refs:
        description: 'Ref(s) to build, comma separated (e.g. evo-13,evo-13-ksu)'
        required: false
        default: 'evo-13'
        type: string
      commit:
        description: 'Exact commit to build (overrides refs; leave empty to use ref head)'
        required: false
        default: ''
        type: string
      upload_release:
        description: 'Publish a GitHub Release after build'
        required: false
        default: false
        type: boolean

env:
  ARCH: arm64
  CLANG_VERSION: "14.0.6"
  CLANG_ID: "r450784d"
  CLANG_DOWNLOAD: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"
  ANY_KERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"
  ANY_KERNEL_BRANCH: "master"

jobs:
  # Split the comma separated refs into a matrix.
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      ref_type: ${{ steps.meta.outputs.ref_type }}
    steps:
      - id: set-matrix
        name: Build matrix
        run: |
          # Normalise: trim whitespace, split on commas, drop empties.
          RAW="${{ github.event.inputs.refs }}"
          RAW="${RAW//,/ }"
          ARR=()
          for r in $RAW; do
            r="${r//[[:space:]]/}"
            [ -n "$r" ] && ARR+=("$r")
          done
          [ ${#ARR[@]} -eq 0 ] && ARR=("evo-13")
          # Build a JSON array of objects so the matrix exposes 'ref' to the
          # build job via matrix.ref (a plain string array has no key).
          J=""
          SEP=""
          for r in "${ARR[@]}"; do
            esc=$(printf '%s' "$r" | sed 's/"/\\"/g')
            J="${J}${SEP}{\"ref\":\"${esc}\"}"
            SEP=","
          done
          J="[${J}]"
          echo "matrix=$J" >> "$GITHUB_OUTPUT"
          echo "Matrix: $J"
      - id: meta
        name: Emit ref type
        run: |
          echo "ref_type=${{ github.event.inputs.ref_type }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ["${{ matrix.ref }}"]
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Matrix jobs each checkout the ref they were dispatched for. The
          # dispatch ref itself (github.ref) is used directly; additional
          # refs in the 'refs' input are built by branching here.
          ref: ${{ format('refs/{0}/{1}', needs.prepare.outputs.ref_type, matrix.ref) }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            git jq libelf-dev libssl-dev lz4 python3 xz-utils zlib1g-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
          echo "deps ok"

      - name: Download AOSP clang ${{ env.CLANG_VERSION }}/${{ env.CLANG_ID }}
        run: |
          mkdir -p toolchains/clang
          curl -L "${{ env.CLANG_DOWNLOAD }}" -o /tmp/clang.tar.gz
          tar xzf /tmp/clang.tar.gz -C toolchains/clang
          echo "clang ready"
          toolchains/clang/bin/clang --version | head -1 || true

      - name: Detect variant name and KSU from defconfig
        id: variant
        run: |
          # LOCALVERSION -> used in artifact name, plus detect KSU.
          LV=$(grep -m1 '^CONFIG_LOCALVERSION=' arch/arm64/configs/lineage-msm8998-yoshino-maple_defconfig | sed 's/.*="\(.*\)"/\1/')
          KSU=$(grep -c '^CONFIG_KSU=y' arch/arm64/configs/lineage-msm8998-yoshino-maple_defconfig)
          if [ "$KSU" = "1" ]; then SUFFIX="-ksu"; else SUFFIX=""; fi
          echo "localversion=$LV"; echo "ksu=$KSU"
          echo "VARIANT=$LV$SUFFIX" >> "$GITHUB_ENV"
          echo "suffix=$SUFFIX" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          make \
            O=out \
            ARCH="${{ env.ARCH }}" \
            CC="$PWD/toolchains/clang/bin/clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabihf-" \
            lineage-msm8998-yoshino-maple_defconfig
          echo "--- config key bits ---"
          grep -E "CONFIG_LOCALVERSION|CONFIG_RANDOMIZE_BASE|CONFIG_KSU|CONFIG_BUILD_ARM64_APPENDED" out/.config || true

      - name: Build kernel (Image.gz-dtb)
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH="${{ env.ARCH }}" \
            CC="$PWD/toolchains/clang/bin/clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabihf-" \
            Image.gz-dtb 2>&1 | tee out/build.log
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 ZIP
        run: |
          git clone --depth=1 "${{ env.ANY_KERNEL_REPO }}" -b "${{ env.ANY_KERNEL_BRANCH }}" AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          sed -i \
            -e 's/do\.devicecheck=1/do.devicecheck=0/' \
            -e 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' \
            -e 's/device\.name1=.*/device.name1=maple/' \
            -e 's/device\.name2=.*/device.name2=maple_dsds/' \
            anykernel.sh
          grep -E "^BLOCK=|do\.devicecheck|device\.name[12]" anykernel.sh
          # per-ref artifact name so multiple refs don't collide in the release
          SAFE=$(echo "${{ matrix.ref }}" | tr '/' '_')
          ZIP="kernel-${SAFE}-${VARIANT}-${{ github.sha }}.zip"
          zip -r9 "../$ZIP" Image.gz-dtb anykernel.sh META-INF/ tools/ -x "*.git*" -x "README.md" 2>/dev/null || \
          zip -r9 "../$ZIP" Image.gz-dtb anykernel.sh META-INF/ -x "*.git*" -x "README.md" 2>/dev/null
          ls -lh "../$ZIP"
          cd ..
          echo "SAFE=$SAFE" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.SAFE }}
          path: |
            kernel-${{ env.SAFE }}-${{ env.VARIANT }}-${{ github.sha }}.zip
            out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 14

  # Merge all matrix artifacts into one release.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event.inputs.upload_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          merge-multiple: true
      - name: List artifacts
        run: |
          echo "=== artifacts ==="
          ls -lh *.zip 2>/dev/null || echo "no zips"
          ls -lh Image.gz-dtb 2>/dev/null || echo "no Image.gz-dtb (skipped)"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ needs.prepare.outputs.ref_type }}-${{ github.run_number }}
          name: "Kernel ${{ needs.prepare.outputs.ref_type }} build #${{ github.run_number }}"
          body: |
            ## Android Kernel for Sony Xperia XZ Premium (maple)

            Built from:
            - refs: `${{ github.event.inputs.refs }}`
            - commit: `${{ github.sha }}`
            - compiler: AOSP clang ${{ env.CLANG_VERSION }} (${{ env.CLANG_ID }})

            Flash the matching `kernel-*.zip` via TWRP, or `dd` the `Image.gz-dtb`.
          files: |
            *.zip
          draft: false
          prerelease: true

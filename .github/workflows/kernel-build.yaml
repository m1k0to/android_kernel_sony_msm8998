# =====================================================================
# Kernel Build (Sony MSM8998 maple + ReSukiSU)
# Platform: Qualcomm MSM8998 (Sony Xperia XZ Premium / maple) | Kernel: 4.4.302
# Compiler: AOSP clang 14.0.6 (r450784d) + GNU binutils aarch64
#
# Dedicated workflow: compiles this kernel with ReSukiSU (root) built-in.
# ReSukiSU is a runtime dependency (gitignored, not vendored): it is cloned
# into the tree and relinked as drivers/kernelsu. Manual hook mode is used
# because 4.4 (non-GKI) does not support the GKI tracepoint hook.
#
# Triggers: manual dispatch, or push to the kernel branch below.
#
# Outputs per run:
#   - kernel-resukisu.zip : AnyKernel3 (flash from TWRP)
#   - Image.gz-dtb        : raw kernel+dtb image (for dd)
# =====================================================================
name: Build Sony MSM8998 Kernel + ReSukiSU

"on":
  workflow_dispatch:
  push:
    branches: [evo-13, evo-13-oc]

env:
  ARCH: arm64
  CLANG_VERSION: "14.0.6"
  CLANG_ID: "r450784d"
  CLANG_DOWNLOAD: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"
  DEFCONFIG: lineage-msm8998-yoshino-maple_defconfig
  ANY_KERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"
  ANY_KERNEL_BRANCH: "master"

jobs:
  build:
    name: Build Kernel + ReSukiSU
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            git jq libelf-dev libssl-dev lz4 python3 xz-utils zlib1g-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
          echo "deps ok"

      - name: Download AOSP clang ${{ env.CLANG_VERSION }}/${{ env.CLANG_ID }}
        run: |
          mkdir -p toolchains/clang
          curl -L "${{ env.CLANG_DOWNLOAD }}" -o /tmp/clang.tar.gz
          tar xzf /tmp/clang.tar.gz -C toolchains/clang
          toolchains/clang/bin/clang --version | head -1 || true

      - name: Set up ReSukiSU
        run: |
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          # Pin ReSukiSU to the exact commit used to build the shipped kernel
          # (matches the ReSukiSU Manager installed on-device).
          git -C KernelSU checkout 25d94debe0ec46334bd739ced1d8ee842e9539c8
          # ReSukiSU kernel lives in KernelSU/kernel: link it into the tree.
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          test -e "$(realpath drivers/kernelsu)/../.git" && echo "ReSukiSU git OK"

      - name: Configure kernel (${{ env.DEFCONFIG }} + ReSukiSU)
        run: |
          make \
            O=out \
            ARCH="${{ env.ARCH }}" \
            CC="$PWD/toolchains/clang/bin/clang" \
            OBJDUMP="$PWD/toolchains/clang/bin/llvm-objdump" \
            OBJCOPY="$PWD/toolchains/clang/bin/llvm-objcopy" \
            STRIP="$PWD/toolchains/clang/bin/llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabihf-" \
            "${{ env.DEFCONFIG }}"
          # Enable ReSukiSU. Manual hook is required for non-GKI 4.4 (no GKI
          # tracepoints); CONFIG_KALLSYMS_ALL is already set in the defconfig.
          scripts/config --file out/.config -e CONFIG_KSU -e CONFIG_KSU_MANUAL_HOOK
          make O=out ARCH="${{ env.ARCH }}" olddefconfig
          echo "--- config key bits ---"
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KALLSYMS_ALL|CONFIG_THREAD_INFO_IN_TASK" out/.config

      - name: Build kernel (Image.gz-dtb)
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH="${{ env.ARCH }}" \
            CC="$PWD/toolchains/clang/bin/clang" \
            OBJDUMP="$PWD/toolchains/clang/bin/llvm-objdump" \
            OBJCOPY="$PWD/toolchains/clang/bin/llvm-objcopy" \
            STRIP="$PWD/toolchains/clang/bin/llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabihf-" \
            Image.gz-dtb 2>&1 | tee out/build.log
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 ZIP
        run: |
          git clone --depth=1 "${{ env.ANY_KERNEL_REPO }}" -b "${{ env.ANY_KERNEL_BRANCH }}" AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          sed -i \
            -e 's/do\.devicecheck=1/do.devicecheck=0/' \
            -e 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' \
            -e 's/device\.name1=.*/device.name1=maple/' \
            -e 's/device\.name2=.*/device.name2=maple_dsds/' \
            anykernel.sh
          grep -E "^BLOCK=|do\.devicecheck|device\.name[12]" anykernel.sh
          zip -r9 "../kernel-resukisu.zip" Image.gz-dtb anykernel.sh META-INF/ tools/ -x "*.git*" -x "README.md" 2>/dev/null || \
          zip -r9 "../kernel-resukisu.zip" Image.gz-dtb anykernel.sh META-INF/ -x "*.git*" -x "README.md" 2>/dev/null
          ls -lh "../kernel-resukisu.zip"
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-resukisu
          path: |
            kernel-resukisu.zip
            out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 14
